# -------------------------
# Groq LLM Configuration
# -------------------------
model:
  provider: openai                      # Identifies the model provider
  name: openai/gpt-oss-20b             # Groq decommissioned llama-3.1-8b-instant
  temperature: 1                        # Sampling temperature
  max_output_tokens: 1024               # Maximum completion tokens
  top_p: 1                              # Nucleus sampling
  stream: true                          # Stream output chunk by chunk
  stop_sequences: []

paths:
  prompts_root: src/prompts             # Root folder containing Q1, Q2
  output_root: output/llama3.1                # Root folder for output PDFs